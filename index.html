<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coffee Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body, html {
      margin: 0; padding: 0; overflow-x: hidden;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      height: 100%;
    }
    /* container that slides */
    #app {
      display: flex;
      width: 200vw;
      height: 100vh;
      transition: transform .8s ease-in-out;
    }
    #app.slide { transform: translateX(-100vw); }

    section { width: 100vw; height: 100%; position: relative; }

    /* Landing */
    #landing {
      background: linear-gradient(135deg, #f2ddc8, #dbc1ac);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6vw;
    }
    .logo {
      position: absolute; top: 20px; left: 20px;
      width: 64px; height: 64px; object-fit: contain;
    }
    #landing-text {
      max-width: 45%;
      color: #38220f;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.1;
    }
    #landing-text h1 {
      font-size: clamp(2.5rem, 4vw, 4rem);
      margin: 0 0 .5rem;
    }
    #landing-visual {
      flex: 1; display: flex; justify-content: center;
    }
    #landing-visual img {
      width: 27vw; max-width: 400px; height: auto;
      border: none; border-radius: 0; box-shadow: none;
    }
    .beans {
      position: absolute; width: 100px; opacity: .8;
      pointer-events: none;
    }
    .beans.left { bottom: 5%; left: 5%; }
    .beans.right { top: 10%; right: 5%; transform: rotate(15deg); }

    .arrow {
      position: absolute; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      font-size: 2rem; color: #38220f; cursor: pointer;
      transition: transform .3s;
    }
    .arrow:hover { transform: translateX(-50%) translateY(5px); }

    /* Catalog */
    #catalog {
      background: #ece0d1;
      overflow-y: auto; padding: 40px 0;
    }
    .catalog-title {
      font-size: 2.5rem; font-weight: 700; color: #38220f;
    }
    .card-coffee {
      background: #fff; border-radius: 12px;
      padding: 1rem; box-shadow: 0 4px 12px rgba(56,34,15,0.1);
      position: relative;
    }
    .card-coffee h5 { margin: 0 0 .3rem; color: #38220f; }
    .card-coffee p { margin: 0; color: #634832; }

    .form-label { color: #634832; font-weight: 600; }
    .form-control, .form-select {
      border-radius: 8px; border: 1px solid #967259;
    }
    .btn-primary {
      background-color: #634832; border: none; border-radius: 8px;
    }
    .btn-primary:hover { background-color: #38220f; }

    /* Improved Delete Button */
    .delete-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #a65242;
      transition: color 0.3s ease;
      font-size: 1.2rem;
      padding: 4px;
      border-radius: 6px;
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
    }
    .delete-btn:hover {
      color: #38220f;
      background: rgba(56, 34, 15, 0.1);
    }

    /* Modal Styling */
    #confirmDeleteModal .modal-content,
    #confirmResetModal .modal-content {
      border-radius: 16px;
      background: #f2ddc8;
      box-shadow: 0 8px 25px rgb(56 34 15 / 0.3);
      border: none;
    }
    #confirmDeleteModal .modal-header,
    #confirmResetModal .modal-header {
      border-bottom: none;
      padding-bottom: 0.5rem;
      background: transparent;
    }
    #confirmDeleteModal .modal-title,
    #confirmResetModal .modal-title {
      color: #38220f;
      font-weight: 700;
      font-size: 1.4rem;
    }
    #confirmDeleteModal .btn-close,
    #confirmResetModal .btn-close {
      filter: brightness(0.4);
      transition: filter 0.2s ease;
    }
    #confirmDeleteModal .btn-close:hover,
    #confirmResetModal .btn-close:hover {
      filter: brightness(0.8);
    }
    #confirmDeleteModal .modal-body,
    #confirmResetModal .modal-body {
      color: #634832;
      font-size: 1.1rem;
      padding-top: 0;
      padding-bottom: 1.5rem;
    }
    #confirmDeleteModal .modal-footer,
    #confirmResetModal .modal-footer {
      background: transparent;
      border-top: none;
      padding-top: 0;
    }
    #confirmDeleteModal .btn-secondary,
    #confirmResetModal .btn-secondary {
      background: transparent;
      border: 1.5px solid #634832;
      color: #634832;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.5rem 1.5rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #confirmDeleteModal .btn-secondary:hover,
    #confirmResetModal .btn-secondary:hover {
      background-color: #634832;
      color: #f2ddc8;
      border-color: #38220f;
    }
    #confirmDeleteModal .btn-primary,
    #confirmResetModal .btn-primary {
      background-color: #634832;
      border: none;
      border-radius: 10px;
      padding: 0.5rem 1.5rem;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    #confirmDeleteModal .btn-primary:hover,
    #confirmResetModal .btn-primary:hover {
      background-color: #38220f;
    }
    /* Reset Button */
    #reset-data-btn {
      margin: 2rem auto 4rem;
      display: block;
      background-color: #634832;
      color: #f2ddc8;
      border: none;
      padding: 0.5rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #reset-data-btn:hover {
      background-color: #38220f;
    }

    /* Toast Container */
    #toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1080;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 350px;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Landing -->
  <section id="landing">
    <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3NzB1b2tqaXRmY2ltdjF0NTQ2ZXgyNnVwamVtcTkwNTA1OHlvbTNzciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/KAJT6Mzkl97xXnlNmF/giphy.gif" alt="Coffee Logo" class="logo" />
    <div id="landing-text">
      <h1>“Life begins after coffee.”</h1>
      <p>Make your own coffee and explore the finest roasts</p>
    </div>
    <div id="landing-visual">
      <img src="heroimg.png" alt="Coffee Bag Hero" />
    </div>
    <img src="beans1.svg" alt="Coffee Beans" class="beans left" />
    <img src="beans3.svg" alt="Coffee Beans" class="beans right" />
    <div class="arrow" id="go-to-catalog">➜</div>
  </section>

  <!-- Catalog -->
  <section id="catalog">
    <div class="container">
      <h1 class="text-center catalog-title mb-4">Coffee Catalog</h1>
      <form class="row mb-4 justify-content-center g-3" id="filter-form">
        <div class="col-md-4">
          <label for="roast-selection" class="form-label">Filter by Roast</label>
          <select id="roast-selection" class="form-select">
            <option value="all">All Roasts</option>
            <option value="light">Light</option>
            <option value="medium">Medium</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="search-name" class="form-label">Search by Name</label>
          <input type="text" id="search-name" class="form-control" placeholder="Type coffee name..." />
        </div>
      </form>
      <div id="coffees" class="row g-4"></div>
      <div class="card mt-5" style="border-radius:12px; background:#dbc1ac; border:0;">
        <div class="card-body">
          <h5 class="card-title mb-3" style="color:#38220f;">Add a New Coffee</h5>
          <form class="row g-3" id="add-coffee-form">
            <div class="col-md-6">
              <label for="new-coffee-name" class="form-label">Coffee Name</label>
              <select id="new-coffee-name" class="form-select">
                <option value="Espresso">Espresso</option>
                <option value="Cappuccino">Cappuccino</option>
                <option value="Latte">Latte</option>
                <option value="Americano">Americano</option>
                <option value="Mocha">Mocha</option>
                <option value="Macchiato">Macchiato</option>
                <option value="Flat White">Flat White</option>
                <option value="Cortado">Cortado</option>
                <option value="Ristretto">Ristretto</option>
                <option value="Affogato">Affogato</option>
                <option value="Irish Coffee">Irish Coffee</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="new-coffee-roast" class="form-label">Roast</label>
              <select id="new-coffee-roast" class="form-select">
                <option value="light">Light</option>
                <option value="medium">Medium</option>
                <option value="dark">Dark</option>
              </select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
          </form>
        </div>
      </div>
      <button id="reset-data-btn">Reset to Default</button>
    </div>
  </section>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmDeleteLabel">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this coffee?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Reset Confirmation Modal -->
<div class="modal fade" id="confirmResetModal" tabindex="-1" aria-labelledby="confirmResetLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmResetLabel">Confirm Reset</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to reset to the default coffee list? This will erase your changes.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmResetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Initial coffee data
  const defaultCoffees = [
    {id: 1, name: "Light City", roast: "light"},
    {id: 2, name: "Half City", roast: "light"},
    {id: 3, name: "Cinnamon", roast: "light"},
    {id: 4, name: "City", roast: "medium"},
    {id: 5, name: "American", roast: "medium"},
    {id: 6, name: "Breakfast", roast: "medium"},
    {id: 7, name: "High", roast: "dark"},
    {id: 8, name: "Continental", roast: "dark"},
    {id: 9, name: "New Orleans", roast: "dark"},
    {id: 10, name: "European", roast: "dark"},
    {id: 11, name: "Espresso", roast: "dark"},
    {id: 12, name: "Italian", roast: "dark"},
    {id: 13, name: "French", roast: "dark"},
  ];

  // DOM references
  const coffeesContainer = document.getElementById("coffees");
  const roastSelection = document.getElementById("roast-selection");
  const searchName = document.getElementById("search-name");
  const addCoffeeForm = document.getElementById("add-coffee-form");
  const newCoffeeNameSelect = document.getElementById("new-coffee-name");
  const newCoffeeRoastSelect = document.getElementById("new-coffee-roast");
  const resetDataBtn = document.getElementById("reset-data-btn");

  let coffees = [];

  // Modal & Toast references
  const confirmDeleteModal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
  const confirmResetModal = new bootstrap.Modal(document.getElementById('confirmResetModal'));
  const toastContainer = document.getElementById('toast-container');

  let coffeeIdToDelete = null;

  // Load coffees from localStorage or default
  function loadCoffees() {
    const stored = localStorage.getItem('coffees');
    if (stored) {
      try {
        coffees = JSON.parse(stored);
      } catch {
        coffees = [...defaultCoffees];
      }
    } else {
      coffees = [...defaultCoffees];
    }
  }

  // Save coffees to localStorage
  function saveCoffees() {
    localStorage.setItem('coffees', JSON.stringify(coffees));
  }

  // Render coffees list based on filters
  function renderCoffees() {
    const roastFilter = roastSelection.value;
    const nameFilter = searchName.value.toLowerCase();

    coffeesContainer.innerHTML = '';

    let filtered = coffees.filter(c => {
      if (roastFilter !== 'all' && c.roast !== roastFilter) return false;
      if (nameFilter && !c.name.toLowerCase().includes(nameFilter)) return false;
      return true;
    });

    if (filtered.length === 0) {
      coffeesContainer.innerHTML = `<p class="text-center text-muted">No coffees found.</p>`;
      return;
    }

    filtered.forEach(c => {
      const card = document.createElement('div');
      card.className = 'col-md-4';

      card.innerHTML = `
        <div class="card-coffee position-relative p-3">
          <button class="delete-btn" aria-label="Delete ${c.name}" title="Delete coffee" data-id="${c.id}">×</button>
          <h5>${c.name}</h5>
          <p>${capitalize(c.roast)} roast</p>
        </div>
      `;

      coffeesContainer.appendChild(card);
    });

    // Attach delete event listeners
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        coffeeIdToDelete = Number(e.target.dataset.id);
        confirmDeleteModal.show();
      });
    });
  }

  // Capitalize first letter
  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  // Add coffee
  addCoffeeForm.addEventListener('submit', e => {
    e.preventDefault();
    const name = newCoffeeNameSelect.value.trim();
    const roast = newCoffeeRoastSelect.value;

    if (!name) return showToast('Please select a coffee name.', 'warning');

    // Check if coffee with same name+roast exists
    if (coffees.some(c => c.name.toLowerCase() === name.toLowerCase() && c.roast === roast)) {
      showToast('This coffee already exists.', 'warning');
      return;
    }

    const newCoffee = {
      id: Date.now(),
      name,
      roast,
    };
    coffees.push(newCoffee);
    saveCoffees();
    renderCoffees();
    addCoffeeForm.reset();
    showToast(`Added coffee: ${name}`, 'success');
  });

  // Confirm delete button
  document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
    if (coffeeIdToDelete !== null) {
      coffees = coffees.filter(c => c.id !== coffeeIdToDelete);
      saveCoffees();
      renderCoffees();
      coffeeIdToDelete = null;
      confirmDeleteModal.hide();
      showToast('Coffee deleted.', 'success');
    }
  });

  // Reset button triggers modal
  resetDataBtn.addEventListener('click', () => {
    confirmResetModal.show();
  });

  // Confirm reset
  document.getElementById('confirmResetBtn').addEventListener('click', () => {
    coffees = [...defaultCoffees];
    saveCoffees();
    renderCoffees();
    confirmResetModal.hide();
    showToast('Coffee list reset to default.', 'success');
  });

  // Filter handlers
  roastSelection.addEventListener('change', renderCoffees);
  searchName.addEventListener('input', renderCoffees);

  // Landing arrow scroll
  document.getElementById('go-to-catalog').addEventListener('click', () => {
    document.getElementById('catalog').scrollIntoView({behavior: 'smooth'});
  });

  // Toast function
  function showToast(message, type = 'success') {
    // Types: success, success, warning, danger
    const toastId = `toast${Date.now()}`;
    const colors = {
      success: 'bg-success text-white',
      success: 'bg-success text-white',
      warning: 'bg-warning text-dark',
      danger: 'bg-danger text-white',
    };

    const toast = document.createElement('div');
    toast.className = `toast align-items-center ${colors[type] || colors.success} border-0`;
    toast.role = 'alert';
    toast.ariaLive = 'assertive';
    toast.ariaAtomic = 'true';
    toast.id = toastId;
    toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${message}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    `;

    toastContainer.appendChild(toast);

    const bsToast = new bootstrap.Toast(toast, { delay: 3500 });
    bsToast.show();

    toast.addEventListener('hidden.bs.toast', () => {
      toast.remove();
    });
  }

  // Init
  loadCoffees();
  renderCoffees();
</script>
</body>
</html>
