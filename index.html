<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coffee Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ece0d1;
            font-family: "Segoe UI", sans-serif;
        }
        h1 {
            color: #38220f;
            font-weight: bold;
        }
        .card {
            background-color: #dbc1ac;
            border: none;
            border-radius: 12px;
        }
        .card-title {
            color: #38220f;
            font-weight: 600;
        }
        .card-text {
            color: #634832;
        }
        .form-label {
            color: #634832;
            font-weight: 500;
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #967259;
        }
        .btn-primary {
            background-color: #634832;
            border: none;
        }
        .btn-primary:hover {
            background-color: #38220f;
        }
        .shadow-sm {
            box-shadow: 0 4px 10px rgba(56,34,15,0.15) !important;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-4"> Coffee Catalog</h1>

    <form id="filter-form" class="row g-3 mb-4">
        <div class="col-md-4">
            <label for="roast-selection" class="form-label">Filter by Roast</label>
            <select id="roast-selection" class="form-select">
                <option value="all">All Roasts</option>
                <option value="light">Light</option>
                <option value="medium">Medium</option>
                <option value="dark">Dark</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="search-name" class="form-label">Search by Name</label>
            <input type="text" id="search-name" class="form-control" placeholder="Type a coffee name...">
        </div>
    </form>

    <div id="coffees" class="row g-4"></div>
    <div class="card mt-5 shadow">
        <div class="card-body">
            <h5 class="card-title">Add a New Coffee</h5>
            <form id="add-coffee-form" class="row g-3">
                <div class="col-md-6">
                    <label for="new-coffee-name" class="form-label">Coffee Name</label>
                    <input type="text" id="new-coffee-name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label for="new-coffee-roast" class="form-label">Roast</label>
                    <select id="new-coffee-roast" class="form-select">
                        <option value="light">Light</option>
                        <option value="medium">Medium</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
